[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tree-agent"
version = "0.1.0"
description = "AI Agent Tree Orchestrator"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = [
    "pydantic>=2.0.0",
    "anthropic>=0.7.0",
    "openai>=1.0.0",
    "google-generativeai>=0.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=5.0",
    "ruff>=0.3.0",
    "mypy>=1.0",
    "types-requests>=2.32",
    "pre-commit>=3.0"
]

[project.scripts]
treeagent = "src.cli:main"
treeagent-swebench = "src.cli.bench.swebench_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--strict-markers --strict-config"

[tool.coverage.run]
source = ["src"]
branch = true
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
    "*/conftest.py",
    "*/cli/*",                  # Exclude CLI tools
    "*/bench/*",               # Exclude benchmark tools
    "*/validators/*",          # Exclude validators (placeholder code)
]

[tool.coverage.report]
fail_under = 39
show_missing = true
skip_covered = false
precision = 2
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "@abstract",
]

[tool.coverage.html]
directory = "coverage_html_report"
