name: CI

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  # Regular build for pushes to main/master
  build:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
          pip install pytest ruff mypy
      - name: Run linter
        run: ruff check .
      - name: Run type checks
        run: |
          PYTHONPATH=src mypy --ignore-missing-imports src tests
      - name: Run tests
        run: pytest -q

  # Build with coverage for PRs only
  build-with-coverage:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pytest python3-pytest-cov
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Install required packages individually to handle failures better
          pip install pytest pytest-cov ruff mypy
          pip install pydantic>=2.0.0 || pip install pydantic
          pip install anthropic openai google-generativeai types-requests || echo "Some optional deps failed"
      - name: Install project in development mode  
        run: |
          pip install -e . || echo "Editable install failed, proceeding with PYTHONPATH"
      - name: Run linter
        continue-on-error: true
        run: ruff check .
      - name: Run type checks  
        continue-on-error: true
        run: |
          PYTHONPATH=src mypy --ignore-missing-imports src tests
      - name: Run tests with coverage
        run: |
          PYTHONPATH=src python -m pytest --cov=src --cov-report=term-missing --cov-report=html --cov-fail-under=84
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage_html_report/
